# channels.yml — ~97 каналов/чатов для мониторинга order-заявок
# Источники: kadrof.ru, vc.ru, partnerkin, huntflow (IT/design), sostav, tgstat (авг 2026).
# priority: 1 = ядро (веб/боты/приложения/dev, прямые заказы)  -> джойнить первыми
#           2 = digital/general — веб/бот-заявки регулярно
#           3 = смежное (дизайн/smm/копирайт) — веб/бот реже, но matcher выцепит
# ВАЖНО:
#  - Часть каналов = вакансии/наём, а не чистые "заказы". intent-фильтр в matcher.py
#    отсеет мусор на входе, так что шум не страшен.
#  - Перед боевым запуском ПРОГОНИ список: Telethon скажет, куда не смог вступить
#    (переименованные/удалённые) — просто выкинешь мёртвые.
#  - НЕ вступай во все 97 сразу с нового аккаунта -> FloodWait/бан.
#    Джойни порциями по 15-20/день, начни с priority 1.

