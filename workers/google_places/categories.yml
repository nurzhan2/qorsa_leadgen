# Business categories to search for via Google Places Text Search.
# `query` is combined with each city name into a free-text search (e.g.
# "стоматология Казань"). Add/remove freely - no code changes needed.
#
# Picked for being small local businesses that commonly have no website -
# exactly the "нет сайта" signal the core scores highly.

