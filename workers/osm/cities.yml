# Cities to search via Overpass, as bounding boxes: [south, west, north, east]
# (latitude/longitude degrees) - this is what Overpass QL's bbox filter
# takes directly, e.g. node["amenity"="cafe"](55.55,37.35,55.95,37.85);
#
# 30 of Russia's largest cities: every million-plus city plus major regional
# centres, roughly in population order.
#
# HOW THESE WERE PRODUCED (not hand-typed - that's where lat/lon swaps and
# typos come from): each box is generated from the city centre plus a radius,
# with the longitude span scaled by 1/cos(latitude) so the box stays roughly
# square on the ground rather than getting stretched in the east-west
# direction at northern latitudes. Every box is then checked for
# south < north, west < east, latitude inside Russia's real range (41..70),
# longitude inside Russia's real range (19..180), and the city centre
# actually falling inside its own box. config.py re-validates all of this at
# load time, so a bad edit fails loudly instead of silently returning
# nothing.
#
# VERIFIED LIVE against overpass-api.de: the Moscow box returns 6233 cafes
# and the Vladivostok box 349 - the latter being the important one, since a
# swapped lat/lon would put 131.9 in the latitude slot and return nothing at
# all for every eastern city.
#
# These are approximate rectangles over each city's built-up area, not exact
# administrative borders, so they may include some suburbs or clip an outlying
# district. That's fine for lead sourcing. Refine with bboxfinder.com or
# nominatim.openstreetmap.org if you need tighter bounds.
#
# Sizes are deliberately not uniform - Moscow gets ~50x50 km, a 500k-person
# regional centre ~20x20 km. A box much larger than the city wastes Overpass
# time on empty space; one much smaller misses whole districts.

cities:
  - name: "Москва"
    bbox: [55.5312, 37.2185, 55.9804, 38.0167]   # ~50x50 km
