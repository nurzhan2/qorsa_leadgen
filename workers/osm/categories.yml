# OSM tags to search for - one Overpass query per (city x category) pair.
# `value` omitted/null matches ANY value for that key (e.g. shop=*).
# Add/remove freely - no code changes needed.
#
# EVERY TAG BELOW WAS VERIFIED, NOT GUESSED. Two checks, both run while
# building this file:
#   1. taginfo (https://taginfo.openstreetmap.org) - is the tag real,
#      documented on the wiki, and actually used worldwide?
#   2. A live Overpass count inside the Moscow bbox - is it used IN RUSSIA?
#      A tag can be popular worldwide and effectively absent here.
# The "~N в Москве" comments are that second number, so a future editor can
# see at a glance which categories are worth their query and which aren't.
#
# See https://wiki.openstreetmap.org/wiki/Map_features for the full tag list.
# If you add a category, check it the same way first: an unused tag still
# costs one Overpass request per city (30 of them) and returns nothing.

