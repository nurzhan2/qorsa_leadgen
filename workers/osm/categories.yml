# ЧЕГО ЗДЕСЬ НЕТ И ПОЧЕМУ (проверено вживую, счётчик в московском bbox = 0):
#
#   клининг              craft=cleaning            0  (office=cleaning: 99 в мире, нет вики)
#   свадебные агентства  office=wedding_planner    0
#   event-агентства      office=event_management   0
#   ремонт квартир       craft=builder             0  (craft=carpenter: 8)
#   переезды             office=moving_company     2  (покрыто office=logistics)
#
# Эти виды бизнеса в российском OSM практически не размечены. Добавлять их
# теги — значит впустую тратить по 30 запросов к Overpass за полный цикл
# на каждую категорию и получать ноль лидов. Если нужны именно они, OSM не
# тот источник; ищи их в 2GIS/Яндекс.Справочнике.
#
# Также убран прежний catch-all `shop: null` (shop=*): при 30 городах это
# самый тяжёлый запрос из всех, и он на 100% дублирует 20+ конкретных
# shop-категорий выше. Верни строкой ниже, если он всё же нужен:
#   - name: "Магазины (общее)"
#     key: "shop"
#     value: null
