# ЧЕГО ЗДЕСЬ НЕТ И ПОЧЕМУ
#
# Все теги ниже РЕАЛЬНЫ и есть в вики — отброшены не за это, а по живому
# счётчику ИМЕНОВАННЫХ объектов в московском bbox. Объекты без name воркер
# всё равно выбрасывает, так что «мало именованных» = «лидов не будет».
#
# Первая волна проверки:
#   клининг              craft=cleaning             0  (office=cleaning: 99 в мире, нет вики)
#   свадебные агентства  office=wedding_planner     0
#   event-агентства      office=event_management    0
#   переезды             office=moving_company      2  (покрыто office=logistics)
#
# Вторая волна (дизайн / ландшафт / стройка):
#   дизайн интерьера     office=interior_design     0  ← самый «профильный» тег, и он пуст
#   геодезия             office=surveyor            5
#   ландшафт/садовники   craft=gardener             3
#   теплицы              landuse=greenhouse_horticulture  6 именованных из 35
#                                                        (это сельхоз-полигоны, не бизнес)
#   сельхозтовары        shop=agrarian              7
#   садовая мебель       shop=garden_furniture      0
#
# Третья волна (гостиницы / досуг):
#   мотели               tourism=motel              5
#   шале                 tourism=chalet             7
#
# НЕ ПРОВЕРЕНЫ — Overpass отдавал 429/504 на момент правки. Проверять тем же
# способом (out count, только именованные, московский bbox, паузы 10-15 с,
# ротация зеркал) и добавлять ТОЛЬКО при реальном объёме:
#   tourism=hostel, amenity=conference_centre, shop=wedding, amenity=nightclub,
#   amenity=bar, amenity=childcare, shop=mall, office=it
#
# ОТДЕЛЬНО — БРИГАДЫ ОТДЕЛОЧНИКОВ. В российском OSM их практически нет:
#   craft=painter     0     craft=roofer      0     craft=joiner   0
#   craft=electrician 1     craft=plumber     2     craft=tiler    4
#   craft=carpenter   5     craft=builder     0
# Это ожидаемо: частные мастера и мелкие бригады не наносят себя на карту.
# Как класс лидов они интересны, но OSM их не знает — ищи в Avito/Профи.ру.
#
# Каждая такая категория стоила бы 30 запросов к Overpass за полный цикл и
# вернула бы ноль. Если нужны именно они — OSM не тот источник; смотри
# 2GIS / Яндекс.Справочник.
#
# УЖЕ ЕСТЬ ВЫШЕ, повторно не добавлялись: shop=furniture, shop=florist,
# shop=interior_decoration, craft=window_construction, amenity=restaurant,
# amenity=clinic.
#
# Также убран прежний catch-all `shop: null` (shop=*): при 30 городах это
# самый тяжёлый запрос из всех, и он на 100% дублирует 20+ конкретных
# shop-категорий выше. Верни строкой ниже, если он всё же нужен:
#   - name: "Магазины (общее)"
#     key: "shop"
#     value: null
