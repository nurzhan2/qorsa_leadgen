spring:
  application:
    name: qorsa-leadgen

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:qorsa_leadgen}
    username: ${DB_USER:qorsa}
    password: ${DB_PASSWORD:qorsa}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only validates the entities against it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  # 8081, not 8080: 8080 is commonly already taken (Apache/Tomcat) on the
  # machines this runs on. Every worker's CORE_URL default matches this.
  port: ${SERVER_PORT:8081}

# Weights and thresholds for kz.qorsa.leadgen.service.ScoringService.
# Tune freely - none of this is hardcoded in the scoring logic.
leadgen:
  scoring:
    no-site-weight: 40
    direct-intent-weight: 35
    competitor-negative-review-weight: 30
    budget-mentioned-weight: 20
    contact-and-geo-weight: 10
    mobile-phone-weight: 15
    toll-free-only-penalty: 10
    fuzzy-name-threshold: 82
    hot-threshold: 70
    qualified-threshold: 40
    # Reserved for a future site-audit worker; not evaluated yet.
    pagespeed-weight: 30
    pagespeed-threshold: 50
    audit-fails-weight: 20
    audit-fails-threshold: 10
  # Google Sheets export (kz.qorsa.leadgen.export). Both env vars must be set
  # for it to do anything - if either is blank, the export disables itself
  # with one WARN at startup and the core runs normally without it.
  sheets:
    credentials-path: ${GOOGLE_CREDENTIALS_PATH:}
    spreadsheet-id: ${SHEETS_SPREADSHEET_ID:}
    fixed-delay-ms: ${SHEETS_SYNC_DELAY_MS:300000}
  # Destructive admin endpoints (DELETE /api/v1/admin/demo-data). OFF unless
  # explicitly switched on, or the "demo" profile is active - see
  # kz.qorsa.leadgen.web.AdminController.
  admin:
    enabled: ${ADMIN_ENABLED:false}

logging:
  level:
    kz.qorsa.leadgen: INFO
